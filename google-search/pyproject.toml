[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "google-search-mcp"
version = "1.1.0"
description = "Google Search MCP Server powered by Gemini API Search Grounding, installable via uv and uvx"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.3.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
google-search-mcp = "google_search_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/google_search_mcp"]
